[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The site is a static bundle with no third-party anything (CLAUDE.md rules 1-3),
# so the policy below can be strict without breaking a single feature. If a
# script ever needs to be added, changing this header is the deliberate step
# that makes it possible -- which is the point.
#
# `connect-src` names the licence API explicitly and nothing else. The request
# form posts there (see src/components/RequestForm.astro), and without this line
# the browser blocks that fetch -- silently, from the page's point of view, so
# every submission would quietly take the Netlify fallback path and nobody would
# know the API was never being reached. It is the one host this site may talk
# to; `default-src 'self'` still refuses everything else.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.lexiarchive.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The thank-you pages are destinations of a form post, not content. A search
# result landing on one would thank a visitor who asked for nothing.
[[headers]]
  for = "/thanks/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/fr/merci/*"
  [headers.values]
    X-Robots-Tag = "noindex"
